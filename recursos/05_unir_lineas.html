<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emparejar Conceptos: Arquitectura de Computadores</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .match-container {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 2.2rem;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08);
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* CONTENEDOR CON CANVAS DE CONEXIONES */
    .match-interactive-stage {
      position: relative;
      margin-bottom: 2rem;
    }

    #connections-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .columns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      position: relative;
      z-index: 3;
    }
    @media (max-width: 650px) {
      .columns-grid { gap: 2rem; }
    }

    .column-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* TARJETAS CON ALTURA UNIFORME Y PUNTOS DE CONEXIÓN */
    .match-btn {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      text-align: left;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px; /* Altura idéntica y estandarizada */
      min-height: 72px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      line-height: 1.45;
    }

    /* Puntos circulares de anclaje de línea */
    .connect-port {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #94a3b8;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 2px #cbd5e1;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: all 0.2s ease;
    }
    .match-btn.left-btn .connect-port {
      right: -8px;
    }
    .match-btn.right-btn .connect-port {
      left: -8px;
    }

    .match-btn:hover {
      border-color: #6366f1;
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(99, 102, 241, 0.15);
    }
    .match-btn:hover .connect-port {
      background: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      transform: translateY(-50%) scale(1.2);
    }

    .match-btn.selected {
      border-color: #4f46e5;
      background: #e0e7ff;
      color: #4338ca;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
      transform: scale(1.02);
    }
    .match-btn.selected .connect-port {
      background: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.4);
      transform: translateY(-50%) scale(1.3);
    }

    .match-btn.matched {
      border-color: #10b981;
      background: #ecfdf5;
      color: #065f46;
      cursor: default;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.12);
    }
    .match-btn.matched .connect-port {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
    }

    .feedback-box {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="match-container">
    <div class="header">
      <h2><i class="fa-solid fa-bezier-curve"></i> Emparejamiento con Líneas de Conexión</h2>
      <p>Selecciona un concepto en la columna izquierda y luego su definición en la derecha para trazar la línea.</p>
    </div>

    <div class="match-interactive-stage" id="stage">
      <!-- Lienzo dinámico para trazar las líneas curvas de conexión -->
      <canvas id="connections-canvas"></canvas>

      <div class="columns-grid">
        <!-- Columna Izquierda: Conceptos -->
        <div>
          <div class="column-title"><i class="fa-solid fa-microchip"></i> Término / Concepto</div>
          <div class="cards-stack">
            <button class="match-btn left-btn" id="l-cpu" onclick="selectSide('l', 'cpu', this)">
              <span>1. CPU (Procesador)</span>
              <div class="connect-port"></div>
            </button>
            <button class="match-btn left-btn" id="l-ram" onclick="selectSide('l', 'ram', this)">
              <span>2. Memoria RAM</span>
              <div class="connect-port"></div>
            </button>
            <button class="match-btn left-btn" id="l-ssd" onclick="selectSide('l', 'ssd', this)">
              <span>3. Unidad SSD</span>
              <div class="connect-port"></div>
            </button>
            <button class="match-btn left-btn" id="l-gpu" onclick="selectSide('l', 'gpu', this)">
              <span>4. Tarjeta Gráfica (GPU)</span>
              <div class="connect-port"></div>
            </button>
          </div>
        </div>

        <!-- Columna Derecha: Definiciones -->
        <div>
          <div class="column-title"><i class="fa-solid fa-align-left"></i> Definición Funcional</div>
          <div class="cards-stack">
            <button class="match-btn right-btn" id="r-ram" onclick="selectSide('r', 'ram', this)">
              <div class="connect-port"></div>
              <span>Almacenamiento volátil ultrarrápido para programas en ejecución.</span>
            </button>
            <button class="match-btn right-btn" id="r-gpu" onclick="selectSide('r', 'gpu', this)">
              <div class="connect-port"></div>
              <span>Procesamiento masivo en paralelo para gráficos e Inteligencia Artificial.</span>
            </button>
            <button class="match-btn right-btn" id="r-cpu" onclick="selectSide('r', 'cpu', this)">
              <div class="connect-port"></div>
              <span>Cerebro central que ejecuta instrucciones y cálculos lógicos.</span>
            </button>
            <button class="match-btn right-btn" id="r-ssd" onclick="selectSide('r', 'ssd', this)">
              <div class="connect-port"></div>
              <span>Almacenamiento no volátil permanente de archivos y sistema operativo.</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="feedback-box" id="feedback">
      <span style="color:#64748b;"><i class="fa-solid fa-hand-pointer"></i> Selecciona un concepto para comenzar a conectar</span>
    </div>
  </div>

  <script>
    let pair = { l: null, r: null, lBtn: null, rBtn: null };
    let connectedPairs = []; // Almacena { lBtn, rBtn, color }
    let matchesCount = 0;

    const COLORS = ['#10b981', '#06b6d4', '#8b5cf6', '#f59e0b'];

    function resizeCanvas() {
      const stage = document.getElementById('stage');
      const canvas = document.getElementById('connections-canvas');
      canvas.width = stage.offsetWidth;
      canvas.height = stage.offsetHeight;
      drawAllLines();
    }

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(resizeCanvas, 50);
    });

    function getPortPosition(btn, isLeft) {
      const stage = document.getElementById('stage');
      const stageRect = stage.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();

      const y = (btnRect.top - stageRect.top) + (btnRect.height / 2);
      const x = isLeft ? (btnRect.right - stageRect.left) : (btnRect.left - stageRect.left);

      return { x, y };
    }

    function drawAllLines() {
      const canvas = document.getElementById('connections-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar líneas ya emparejadas
      connectedPairs.forEach(p => {
        const p1 = getPortPosition(p.lBtn, true);
        const p2 = getPortPosition(p.rBtn, false);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        
        // Curva Bezier estética y suave
        const controlOffset = Math.abs(p2.x - p1.x) * 0.5;
        ctx.bezierCurveTo(p1.x + controlOffset, p1.y, p2.x - controlOffset, p2.y, p2.x, p2.y);

        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0; // reset
      });
    }

    function selectSide(side, id, btn) {
      if (side === 'l') {
        if (pair.lBtn) pair.lBtn.classList.remove('selected');
        pair.l = id;
        pair.lBtn = btn;
        btn.classList.add('selected');
      } else {
        if (pair.rBtn) pair.rBtn.classList.remove('selected');
        pair.r = id;
        pair.rBtn = btn;
        btn.classList.add('selected');
      }

      if (pair.l && pair.r) {
        if (pair.l === pair.r) {
          // Acierto: Guardar conexión y trazar línea
          const lineColor = COLORS[matchesCount % COLORS.length];
          connectedPairs.push({ lBtn: pair.lBtn, rBtn: pair.rBtn, color: lineColor });

          pair.lBtn.classList.remove('selected');
          pair.rBtn.classList.remove('selected');
          pair.lBtn.classList.add('matched');
          pair.rBtn.classList.add('matched');

          drawAllLines();

          matchesCount++;
          document.getElementById('feedback').innerHTML = '✅ <span style="color:#15803d; font-weight:800;">¡Conexión correcta! Par asociado exitosamente.</span>';
          pair = { l: null, r: null, lBtn: null, rBtn: null };

          if (matchesCount === 4) {
            document.getElementById('feedback').innerHTML = '🏆 <strong style="color:#15803d;">¡Extraordinario! Todas las líneas se han conectado con éxito.</strong>';
          }
        } else {
          // Error
          document.getElementById('feedback').innerHTML = '❌ <span style="color:#dc2626; font-weight:800;">No coinciden. Intenta asociar con la definición correspondiente.</span>';
          const tempL = pair.lBtn;
          const tempR = pair.rBtn;

          setTimeout(() => {
            if (tempL) tempL.classList.remove('selected');
            if (tempR) tempR.classList.remove('selected');
            pair = { l: null, r: null, lBtn: null, rBtn: null };
          }, 500);
        }
      }
    }
  </script>
</body>
</html>
